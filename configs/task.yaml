agent:
  class: PPO
  clip_predicted_values: true
  discount_factor: 0.998
  entropy_loss_scale: 0.01
  experiment:
    checkpoint_interval: 0
    directory: /workspace/runs
    experiment_name: bowl_40refs
    write_interval: 24
  grad_norm_clip: 1.0
  kl_threshold: 0.0
  lambda: 0.95
  learning_epochs: 5
  learning_rate: 0.0001
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
  learning_starts: 0
  mini_batches: 4
  random_timesteps: 0
  ratio_clip: 0.2
  rewards_shaper_scale: 1.0
  rollouts: 24
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  time_limit_bootstrap: true
  value_clip: 0.2
  value_loss_scale: 1.0
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
garmi_task:
  action_space: base_velocity_joint_delta_v1
  approach_reward: gap_pose_v1
  approach_reward_parameters:
    distance_clip_m: 2.0
    distance_scale_per_m: 2.0
  controller:
    alignment_angle: 0.15
    alignment_distance: 0.015
    alignment_seconds: 0.1
    approach_seconds: 30.0
    close_seconds: 2.0
    hold_seconds: 3.0
    lift_distance: 0.12
    lift_seconds: 3.0
    settle_seconds: 0.5
  episode_length_s: 39.0
  kitchen:
    base_bounds_map_xy:
    - - -0.25
      - 6.2
    - - 0.85
      - 6.5
    base_map_yaw_degrees: 90.0
    bowl_map_yaw_degrees: 0.0
    bowl_regions:
    - bounds_map_xy:
      - - -0.23
        - 7.23
      - - 0.55
        - 7.63
      name: left
      probability: 0.75
    - bounds_map_xy:
      - - 1.17
        - 7.23
      - - 1.43
        - 7.63
      name: right
      probability: 0.25
    drop_height_m: 0.845
    mask: /workspace/assets/reference_filter/position-mask.json
    movement_bounds_task_xy:
    - - -0.5
      - -1.4
    - - 0.45
      - 1.2
    scene_usd: /workspace/assets/kitchen/kitchen.usda
  multi_object:
    manifest: /workspace/assets/grasp_bank/selected-40.json
    objects:
    - bowl
    reference_ids:
      bowl:
      - bowl-r020
      - bowl-n121
      - bowl-n082
      - bowl-r060
      - bowl-r086
      - bowl-r005
      - bowl-r076
      - bowl-n017
      - bowl-r004
      - bowl-r027
      - bowl-n085
      - bowl-r031
      - bowl-n284
      - bowl-r051
      - bowl-n080
      - bowl-n072
      - bowl-n228
      - bowl-r011
      - bowl-r094
      - bowl-r035
      - bowl-r055
      - bowl-n071
      - bowl-n308
      - bowl-n061
      - bowl-n270
      - bowl-n269
      - bowl-r092
      - bowl-n274
      - bowl-r109
      - bowl-n271
      - bowl-n196
      - bowl-r019
      - bowl-r096
      - bowl-n267
      - bowl-r018
      - bowl-n233
      - bowl-n049
      - bowl-n235
      - bowl-n190
      - bowl-n027
    split: all
  observation_time_scale_s: 15.0
  success_bonus: 115.0
  variant: fixed_finish_v3
memory:
  class: RandomMemory
  memory_size: -1
models:
  policy:
    class: GaussianMixin
    clip_actions: true
    clip_log_std: true
    initial_log_std: 0.0
    max_log_std: 2.0
    min_log_std: -20.0
    network:
    - activations: elu
      input: STATES
      layers:
      - 1024
      - 512
      - 512
      - 256
      - 128
      - 128
      - 128
      - 64
      - 64
      name: net
    output: ACTIONS
  separate: false
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - activations: elu
      input: STATES
      layers:
      - 1024
      - 512
      - 512
      - 256
      - 128
      - 128
      - 128
      - 64
      - 64
      name: net
    output: ONE
seed: 42
trainer:
  class: SequentialTrainer
  close_environment_at_exit: false
  disable_progressbar: true
  environment_info: log
  timesteps: 192000
