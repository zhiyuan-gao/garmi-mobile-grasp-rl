<!doctype html><html lang="en"><meta charset="utf-8"><title>GARMI household task</title>
<style>body{font:16px system-ui;background:#181825;color:#cdd6f4;max-width:960px;margin:30px auto;padding:20px}li{padding:6px}.done{color:#a6e3a1}.current{color:#89b4fa}pre{white-space:pre-wrap}a{color:#89b4fa}</style>
<h1>GARMI household task</h1><p>Both objects start on the kitchen counter. The bowl goes to the dining table; the mug goes into the upper drawer. Isaac Sim runs on the Desktop, with measured motion synchronized to NeemHub.</p>
<p id="status">Connecting…</p><ol id="stages"></ol><h2>Measured state</h2><pre id="state"></pre><h2>Run files</h2><div id="files"></div>
<script>async function update(){try{const r=await fetch('api/status',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();document.querySelector('#status').textContent=s.message;document.querySelector('#stages').replaceChildren(...s.stages.map((x,i)=>{const e=document.createElement('li');e.textContent=x;e.className=s.status==='completed'||i<s.stage?'done':i===s.stage?'current':'';return e}));const x=(s.state||{}).snapshot||{};document.querySelector('#state').textContent=JSON.stringify({simulation_seconds:x.simulation_seconds,stage:x.sequence_stage,bowl_position:x.object_map_position,mug_position:x.mug_map_position,drawer_opening_m:x.drawer_opening_m},null,2);document.querySelector('#files').replaceChildren(...(s.files||[]).map(f=>{const p=document.createElement('p'),a=document.createElement('a');a.textContent=f;a.href='runs/'+encodeURIComponent(s.run_id)+'/'+f;p.append(a);return p}))}catch(e){document.querySelector('#status').textContent='Waiting for task service: '+e.message}setTimeout(update,1000)}update()</script></html>
